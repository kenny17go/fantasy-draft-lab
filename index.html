<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="robots" content="noindex"><title>Fantasy Draft Lab</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><div><small>FANTASY BASKETBALL</small><h1>Fantasy Draft Lab <span>V0.1 Preview</span></h1></div><button id="export" class="secondary">匯出 JSON</button></header>
<main><section class="panel"><div class="section-head"><h2>聯盟設定</h2><label>模式 <select id="mode"><option value="h2h">H2H · 9-Cat</option><option value="roto">ROTO · 9-Cat</option></select></label></div><div class="metrics" id="summary"></div><p class="hint" id="roster"></p></section>
<section class="panel"><div class="section-head"><h2>登記競標成交</h2><span class="tag">手動輸入 · 本機保存</span></div><form id="purchase"><label>球員姓名<input id="player" required maxlength="90" placeholder="輸入球員姓名"></label><label>得標隊伍<select id="team"></select></label><label>成交價 ($)<input id="price" type="number" min="1" step="1" required value="1"></label><button type="submit">確認成交</button></form><p id="feedback" role="status"></p></section>
<section class="panel"><div class="section-head"><h2>14 隊預算</h2><span class="tag">每隊 $200</span></div><div class="table-wrap"><table><thead><tr><th>隊伍</th><th>已選</th><th>已花</th><th>剩餘</th><th>最高合法出價</th></tr></thead><tbody id="teams"></tbody></table></div></section>
<section class="panel"><div class="section-head"><h2>成交紀錄</h2><button class="secondary" id="undo">復原上一筆</button></div><div class="table-wrap"><table><thead><tr><th>#</th><th>球員</th><th>隊伍</th><th>成交價</th></tr></thead><tbody id="history"></tbody></table></div><div class="actions"><label class="import">匯入備份 JSON<input type="file" id="import" accept="application/json,.json"></label><button class="danger" id="reset">清除目前聯盟資料</button></div></section>
<footer>測試版：目前不含真實球員預測、Z-Score 或 Auction 估值。所有資料僅保存在此瀏覽器。</footer></main><script type="module" src="./src/app.js"></script></body></html>
