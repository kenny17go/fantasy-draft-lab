<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H2H 名單與 IL 管理 · Fantasy Draft Lab</title><link rel="stylesheet" href="./styles.css"><style>main{max-width:950px;margin:auto;padding:16px}input,select,button{padding:10px;margin:4px}select{max-width:100%}.player{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px;border-bottom:1px solid #7775}.player label{display:flex;gap:9px;align-items:center}.hint{opacity:.8}#players{max-height:65vh;overflow:auto}</style></head><body><header><div><small>FANTASY BASKETBALL</small><h1>H2H 選秀結果／IL 管理</h1><a href="./index.html">← 返回首頁</a></div></header><main><section class="panel"><h2>匯入 14 隊選秀結果</h2><p class="hint">選擇 fantasy-draft-lab-h2h-2026-27-draft-results.json。此為 Yahoo 當前球員歸屬快照，不含成交價格；不會覆蓋正式選秀 Auction 成交紀錄。</p><input id="import-roster" type="file" accept=".json,application/json"><p id="status" role="status">尚未匯入名單</p><label>選擇 Fantasy 隊伍 <select id="team"></select></label><p id="summary"></p><div id="players"></div><h3>手動新增球員</h3><p class="hint">球員會加入目前選取的 Fantasy 隊伍；最多 13 人（含 IL）。</p><input id="new-name" placeholder="球員姓名"><input id="new-nba" placeholder="NBA 球隊，例如 BOS" maxlength="3"><button id="add-player" type="button">新增球員</button><div class="actions"><button id="export" type="button">匯出含 IL 標記的名單 JSON</button><button id="clear" type="button" class="secondary">清除本機名單</button></div><p class="hint">每隊最多標記 1 位 IL。選取其他球員會取代原 IL；取消勾選即可恢復一般名額。標記只代表人工設定，不會自動判斷球員傷勢。資料儲存在此瀏覽器。</p></section></main><script type="module" src="./src/h2h-il-page.js"></script></body></html>
