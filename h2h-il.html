<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H2H 名單與 IL 管理 · Fantasy Draft Lab</title><link rel="stylesheet" href="./styles.css"><style>
main{max-width:950px;margin:auto;padding:12px}
input,select{max-width:100%;box-sizing:border-box}
.hint{opacity:.8}
#summary{font-size:.92rem;margin:10px 0}
#players{max-height:none;overflow:visible;display:grid;grid-template-columns:1fr;gap:0}
.player{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #7774;min-height:38px}
.player .player-name{min-width:0;font-size:clamp(12px,3.35vw,15px);line-height:1.25;overflow-wrap:anywhere;word-break:normal}
.player label{display:flex;align-items:center;gap:3px;white-space:nowrap;font-size:12px}
.player label input{width:17px;height:17px;margin:0;flex:none}
.player button{font-size:12px!important;line-height:1.1!important;min-height:30px!important;min-width:0!important;padding:6px 8px!important;margin:0!important;border-radius:7px!important;width:auto!important}
@media(max-width:380px){.player{gap:4px}.player .player-name{font-size:12px}.player button{padding:5px 6px!important;font-size:11px!important}}
</style></head><body><header><div><small>FANTASY BASKETBALL</small><h1>H2H 選秀結果／IL 管理</h1><a href="./index.html">← 返回首頁</a></div></header><main><section class="panel"><h2>匯入 14 隊選秀結果</h2><p class="hint">選擇 fantasy-draft-lab-h2h-2026-27-draft-results.json。此為 Yahoo 當前球員歸屬快照，不含成交價格；不會覆蓋正式選秀 Auction 成交紀錄。</p><input id="import-roster" type="file" accept=".json,application/json"><p id="status" role="status">尚未匯入名單</p><label>選擇 Fantasy 隊伍 <select id="team"></select></label><p id="summary"></p><div id="players"></div><h3>手動新增球員</h3><p class="hint">球員會加入目前選取的 Fantasy 隊伍；最多 13 人（含 IL）。</p><input id="new-name" placeholder="球員姓名"><input id="new-nba" placeholder="NBA 球隊，例如 BOS" maxlength="3"><button id="add-player" type="button">新增球員</button><div class="actions"><button id="export" type="button">匯出含 IL 標記的名單 JSON</button><button id="clear" type="button" class="secondary">清除本機名單</button></div><p class="hint">每隊最多標記 1 位 IL。選取其他球員會取代原 IL；取消勾選即可恢復一般名額。標記只代表人工設定，不會自動判斷球員傷勢。資料儲存在此瀏覽器。</p></section></main><script type="module" src="./src/h2h-il-page.js"></script></body></html>
