<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H2H Schedule Grid · Fantasy Draft Lab</title><link rel="stylesheet" href="./styles.css"><style>main{max-width:1100px;margin:auto;padding:16px}.schedule-wrap{overflow:auto;max-height:75vh}#schedule-table{border-collapse:collapse;min-width:780px;width:100%}#schedule-table th,#schedule-table td{border:1px solid #64748b55;padding:9px 6px;text-align:center;white-space:nowrap}#schedule-table th{position:sticky;top:0;background:#1f2937;color:white}#schedule-table td:first-child{position:sticky;left:0;background:#1f2937;color:white;font-weight:700}.count4{background:#14532d66}.count2{background:#92400e55}textarea{width:100%;min-height:90px}input,button{margin:6px;padding:9px}.hint{opacity:.85}</style></head><body><header><div><small>FANTASY BASKETBALL</small><h1>H2H Schedule Grid</h1><a href="./index.html">← 返回 Fantasy Draft Lab</a></div></header><main><section class="panel"><h2>NBA 30 隊每週賽程</h2><p class="hint">獨立功能測試版。先匯入已核實的 NBA 賽程 CSV（date,home,away；日期使用美國當地比賽日期）。可自動讀取 ESPN 公開 NBA 賽程；若來源暫時無法連線，仍可使用 CSV 備援。</p><label>本週日期 <input type="date" id="week" value="2026-10-19"></label><label>篩選 NBA 球隊 <select id="filter"><option value="">全部 30 隊</option></select></label><button id="fetch-schedule" type="button">更新本週 NBA 賽程</button><label class="import">匯入賽程 CSV <input type="file" id="schedule-file" accept=".csv,text/csv"></label><details><summary>或貼上 CSV 文字</summary><textarea id="schedule-paste" placeholder="date,home,away&#10;2026-10-20,NYK,PHI"></textarea><button id="parse-paste" type="button">讀取貼上賽程</button></details><p id="schedule-status" role="status"></p><div class="schedule-wrap"><table id="schedule-table"><thead></thead><tbody></tbody></table></div><p class="hint">主場顯示對手代碼，客場以 @ 標示；每格可查看當日對手。資料只儲存在本機瀏覽器。下一階段才加入 Yahoo 名單與每週九項對戰預測。</p></section></main><script type="module" src="./src/h2h-schedule-page.js"></script></body></html>
