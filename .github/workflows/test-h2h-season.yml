name: H2H season validation
on:
  pull_request:
    paths:
      - 'scripts/season_store.py'
      - 'tests/test_season_store.py'
      - 'tests/test_season_discovery.py'
      - 'scripts/season_discovery.py'
      - 'data/nba-*.csv'
      - '.github/workflows/test-h2h-season.yml'
  push:
    branches:
      - feature/h2h-schedule-grid-v1-20261020
    paths:
      - 'scripts/season_store.py'
      - 'tests/test_season_store.py'
      - 'data/nba-*.csv'
      - '.github/workflows/test-h2h-season.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate season fixtures and rollback
        run: python3 -m unittest discover -s tests -p 'test_season_*.py' -v
