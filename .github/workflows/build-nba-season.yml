name: Build NBA 2026-27 season schedule
on:
  pull_request:
    paths:
      - '.github/workflows/build-nba-season.yml'
      - 'scripts/build_nba_schedule.py'
  push:
    branches:
      - feature/h2h-schedule-grid-v1-20261020
    paths:
      - '.github/workflows/build-nba-season.yml'
      - 'scripts/build_nba_schedule.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y poppler-utils
          fi
      - name: Download official NBA schedule
        run: |
          curl --fail --location --retry 3 --output /tmp/nba-schedule.pdf 'https://ak-static.cms.nba.com/wp-content/uploads/sites/46/2026/08/2026-27-NBA-Regular-Season-Schedule-By-Date.pdf'
          test -s /tmp/nba-schedule.pdf
          pdftotext -layout /tmp/nba-schedule.pdf /tmp/nba-schedule.txt
      - name: Extract and validate fixed games
        run: python3 scripts/build_nba_schedule.py /tmp/nba-schedule.txt data/nba-2026-27.csv
      - name: Upload validated CSV artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: nba-2026-27-validated-schedule
          path: data/nba-2026-27.csv
          if-no-files-found: error

      - name: Commit verified season CSV to feature branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba-2026-27.csv
          git diff --cached --quiet || (git commit -m 'data: add validated NBA 2026-27 fixed schedule' && git push origin HEAD:${{ github.ref_name }})
