name: Refresh FantasyPros NBA teams
on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download player-team table
        run: python scripts/fetch_fantasypros_teams.py --output data/nba-player-teams.json
      - name: Commit only if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nba-player-teams.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh NBA player teams from FantasyPros"
            git push
          fi
