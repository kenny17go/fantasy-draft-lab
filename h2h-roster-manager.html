<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H2H 14 隊名單與 IL 管理</title><link rel="stylesheet" href="./styles.css"><style>main{max-width:1000px;margin:auto;padding:16px}.panel{margin:14px 0}select,input,button{padding:10px;margin:4px}select{max-width:100%}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.player{border:1px solid #64748b66;border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px}.player label{flex:1}.hint{opacity:.8}button{cursor:pointer}</style></head><body><header><div><h1>H2H 14 隊名單／IL 管理</h1><a href="./index.html">← 返回 Fantasy Draft Lab</a></div></header><main><section class="panel"><h2>匯入 Yahoo 14 隊名單 JSON</h2><p class="hint">請選擇 fantasy-draft-lab-h2h-2026-27-draft-results.json。這是目前 Yahoo 隊伍歸屬快照，不含 Auction 成交價；不會改動正式選秀成交紀錄或球員預測。</p><input id="file" type="file" accept=".json,application/json"><p id="status" role="status">尚未匯入。資料與 IL 標記只保存在此瀏覽器。</p><button id="export" type="button" disabled>下載含 IL 標記的 JSON</button><button id="clear" type="button">清除本頁名單</button></section><section class="panel"><h2>人工標記傷兵名單</h2><label>選擇隊伍 <select id="team"></select></label><p id="count"></p><div id="players" class="players"></div></section></main><script type="module" src="./src/h2h-roster-manager.js"></script></body></html>
